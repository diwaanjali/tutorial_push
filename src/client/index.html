<!DOCTYPE html>
<html lang="en" data-theme="light" data-text-size="normal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Campus Pulse - Clean, intelligent campus life organiser for students. Extract events from messy WhatsApp messages, detect clashes, and get weekly digests." />
    <title>Campus Pulse - Intelligent Campus Life Organiser</title>

    <!-- Inline SVG Favicon to avoid large image assets -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231a73e8'%3E%3Cpath d='M12 2L1 12h3v9h6v-6h4v6h6v-9h3L12 2z'/%3E%3C/svg%3E" />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="./styles/theme.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/components.css" />
  </head>
  <body>
    <!-- WCAG 2.2 AA Skip Link -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Top Accessible Header Landmark -->
    <header class="app-header" role="banner">
      <div class="header-content" id="header-container">
        <!-- Rendered by header component -->
      </div>
    </header>

    <!-- Main Content Landmark -->
    <main class="app-container" id="main-content" role="main" tabindex="-1">
      <!-- 1. Needs Attention Today Banner -->
      <section id="attention-section" aria-label="Attention Required Today">
        <!-- Rendered by attention component -->
      </section>

      <!-- 2. Smart Input Zone (Add Panel) -->
      <section id="add-section" aria-labelledby="add-panel-heading">
        <!-- Rendered by addPanel component -->
      </section>

      <!-- 3. My Items Zone (Organised View) -->
      <section id="items-section" aria-labelledby="items-heading">
        <!-- Rendered by itemsView component -->
      </section>
    </main>

    <!-- Modal & Dialog Mounting Container -->
    <div id="modal-root" aria-hidden="true"></div>

    <!-- Live Announcements Region for Screen Readers -->
    <div id="a11y-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

    <!-- Toast Notifications Container -->
    <div id="toast-root" class="toast-container" role="region" aria-label="Notifications"></div>

    <!-- Footer Landmark -->
    <footer class="app-footer" role="contentinfo">
      <div class="footer-content">
        <p><strong>Campus Pulse</strong> — Google Prompt Wars Hackathon</p>
        <p><small>Privacy Note: All your campus items and profile settings are stored locally in your browser. No personal data is stored on our servers.</small></p>
        <p><small>Powered by Google Gemini 2.5 Flash &amp; Antigravity</small></p>
      </div>
    </footer>

    <!-- Bootstrap Script -->
    <script type="module" src="./main.ts"></script>
  </body>
</html>
